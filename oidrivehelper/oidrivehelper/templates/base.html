<!doctype html>
<title>{% block title %}{% endblock %} - OI Drive Helper</title>
<nav>
  <h1>OI Drive Helper</h1>
  <ul>
    {% if g.logged_in %}
      <li><a href="{{ url_for('auth.logout') }}">Log out</a>
    {% else %}
      <li><a href="{{ url_for('auth.login') }}">Log in</a>
    {% endif %}
  </ul>
</nav>
<section class="content">
  {% block content %}{% endblock %}
</section>
