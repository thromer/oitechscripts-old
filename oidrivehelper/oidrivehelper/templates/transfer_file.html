{% extends 'base.html' %}

{% block title %}Transfer File{% endblock %}

{% block content %}
  <form method="get">
    <input type="text" name="file_url" value="{{ file_url }}" placeholder="File URL">
    <input type="text" name="new_owner" value="{{ new_owner }}" placeholder="New owner email address">
    <button type="submit" name="transfer" value="transfer" >Transfer</button>
  </form>

  {% if result %}
  <hr/>
  <pre>
{{ result }}
  </pre>
  {% endif %}

{% endblock %}
