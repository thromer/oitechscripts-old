[project]
name = "oidrivehelper"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "google-api-python-client>=2.196.0",
    "google-auth>=2.52.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "google-cloud-firestore>=2.27.0",
    "google-cloud-secret-manager>=2.28.0",
    "requests>=2.33.1",
]

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "--strict-markers",
]

[tool.pyright]
typeCheckingMode = "recommended"
reportUnannotatedClassAttribute = false
stubPath = "./stubs"

[tool.ruff.lint]

select = [
  "ALL",
]

ignore = [
  "COM812", # missing-trailing-comma -- let the formatter deal with it
  "D100",   # undocumented-public-module
  "D101",   # undocumented-public-class
  "D103",   # undocumented-public-function
  "D104",   # undocumented-public-package
  "D203",   # incorrect-blank-line-before-class
  "D213",   # multi-line-summary-second-line
  "DTZ007", # Naive datetime constructed using `datetime.datetime.strptime()` without %z
  "ERA001", # Commented out code
  "FIX002", # line-contains-todo
  "SLF001", # Private member accessed -- handled by basedpyright
  "T201",   # print
  "T203",   # pprint
  "TC006",  # runtime-cast-value
  "TD002",  # missing-todo-author
  "TD003",  # missing-todo-link
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["D", "PLR2004", "S101"]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "google-api-python-client-stubs>=1.36.0",
    "ruff>=0.15.12",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
lines-after-imports = 2
